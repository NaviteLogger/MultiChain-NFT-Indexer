openapi: 3.0.3
info:
  title: Multi-Chain NFT Indexer
  version: 0.1.0
  description: |
    REST + WebSocket surface of the indexer. The Rust service watches an EVM
    chain via WebSocket logs, normalises Transfer / Minted events into Postgres,
    and exposes them through this API. SIWE (Sign-In With Ethereum) authenticates
    privileged routes; HS256 JWTs carry the recovered address.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Local

security:
  - {}

paths:
  /healthz:
    get:
      summary: Liveness probe
      operationId: healthz
      tags: [system]
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /api/stats:
    get:
      summary: Aggregate counters
      operationId: getStats
      tags: [stats]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"

  /api/events:
    get:
      summary: List events (paginated by `before_id`)
      operationId: listEvents
      tags: [events]
      parameters:
        - in: query
          name: chain_id
          schema: {type: integer, format: int64}
        - in: query
          name: contract
          schema: {$ref: "#/components/schemas/EvmAddress"}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - in: query
          name: before_id
          schema: {type: integer, format: int64}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Event"}
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/nfts/{contract}/{token_id}:
    get:
      summary: Lookup an NFT by contract + token id
      operationId: getNft
      tags: [nfts]
      parameters:
        - in: path
          name: contract
          required: true
          schema: {$ref: "#/components/schemas/EvmAddress"}
        - in: path
          name: token_id
          required: true
          schema: {type: string, pattern: "^(0|[1-9][0-9]*)$"}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Nft"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/holders/{address}:
    get:
      summary: List NFTs currently owned by an address
      operationId: listHoldings
      tags: [holders]
      parameters:
        - in: path
          name: address
          required: true
          schema: {$ref: "#/components/schemas/EvmAddress"}
        - in: query
          name: chain_id
          schema: {type: integer, format: int64}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 500, default: 50}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Nft"}
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/me:
    get:
      summary: Current authenticated address (requires Bearer JWT from /auth/verify)
      operationId: me
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [address]
                properties:
                  address: {$ref: "#/components/schemas/EvmAddress"}
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/nonce:
    post:
      summary: Issue a single-use SIWE nonce
      operationId: siweNonce
      tags: [auth]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [nonce]
                properties:
                  nonce:
                    type: string
                    minLength: 8

  /auth/verify:
    post:
      summary: Verify a signed SIWE message and issue a JWT
      operationId: siweVerify
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VerifyResponse"}
        "400":
          $ref: "#/components/responses/BadRequest"

components:
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: Not found
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    EvmAddress:
      type: string
      pattern: "^0x[a-fA-F0-9]{40}$"
      example: "0x70997970c51812dc3a010c7d01b50e0d17dc79c8"

    Stats:
      type: object
      required: [events_total, nfts_total, holders_total]
      properties:
        events_total: {type: integer, format: int64}
        nfts_total: {type: integer, format: int64}
        holders_total: {type: integer, format: int64}
        last_block:
          type: integer
          format: int64
          nullable: true

    Event:
      type: object
      required: [id, chain_id, contract, event, to_address, token_id, tx_hash, log_index, block_number, block_timestamp]
      properties:
        id: {type: integer, format: int64}
        chain_id: {type: integer, format: int64}
        contract: {$ref: "#/components/schemas/EvmAddress"}
        event:
          type: string
          enum: [Transfer, Minted]
        from_address:
          type: string
          pattern: "^0x[a-fA-F0-9]{40}$"
          nullable: true
        to_address: {$ref: "#/components/schemas/EvmAddress"}
        token_id: {type: string}
        uri:
          type: string
          nullable: true
        tx_hash:
          type: string
          pattern: "^0x[a-fA-F0-9]{64}$"
        log_index: {type: integer, format: int64}
        block_number: {type: integer, format: int64}
        block_timestamp:
          type: string
          format: date-time

    Nft:
      type: object
      required: [chain_id, contract, token_id, current_owner, mint_block, mint_tx, last_transfer_block, last_updated]
      properties:
        chain_id: {type: integer, format: int64}
        contract: {$ref: "#/components/schemas/EvmAddress"}
        token_id: {type: string}
        current_owner: {$ref: "#/components/schemas/EvmAddress"}
        uri:
          type: string
          nullable: true
        mint_block: {type: integer, format: int64}
        mint_tx: {type: string}
        last_transfer_block: {type: integer, format: int64}
        last_updated:
          type: string
          format: date-time

    VerifyRequest:
      type: object
      required: [message, signature]
      properties:
        message:
          type: string
          description: Raw EIP-4361 SIWE message
        signature:
          type: string
          pattern: "^0x[a-fA-F0-9]{130}$"

    VerifyResponse:
      type: object
      required: [address, token]
      properties:
        address: {$ref: "#/components/schemas/EvmAddress"}
        token:
          type: string
          description: HS256 JWT bearer token (12h)

    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}

tags:
  - name: system
  - name: stats
  - name: events
  - name: nfts
  - name: holders
  - name: auth
