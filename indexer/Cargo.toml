[package]
name = "indexer"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "indexer"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time"] }
futures = "0.3"

axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "migrate", "uuid", "chrono", "json"] }

alloy = { version = "0.5", features = ["providers", "provider-ws", "rpc-types-eth", "pubsub", "sol-types"] }

siwe = "0.6"
jsonwebtoken = "10"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "3", features = ["chrono_0_4"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hex = "0.4"
url = "2"
dotenvy = "0.15"

[dev-dependencies]
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "macros", "uuid", "chrono"] }
tokio = { version = "1.40", features = ["full", "test-util"] }
